# AegisCase Frontend — nginx server block for the static SPA.
# Serves the Vite build and falls back to index.html so that client-side
# routes (react-router) resolve on hard reload / deep links.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache fingerprinted assets emitted by Vite (filenames are hashed).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: any unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
